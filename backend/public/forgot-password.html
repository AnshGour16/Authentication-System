<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Recovery — SecureAuth Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Ambient Background Glow Canvas -->
    <div class="ambient-glow-wrapper" aria-hidden="true">
        <div class="glow-orb glow-orb-1"></div>
        <div class="glow-orb glow-orb-2"></div>
        <div class="glow-orb glow-orb-3"></div>
    </div>
    <div class="grid-mesh" aria-hidden="true"></div>
    <!-- Top Global Navbar -->
    <nav class="navbar" aria-label="Main Navigation">
        <div class="navbar-container">
            <a href="index.html" class="navbar-brand">
                <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
                <span>SecureAuth</span>
            </a>
            <div class="navbar-actions">
                <a href="login.html" class="btn-outline-sm"><i class="bi bi-arrow-left"></i> Back to Sign In</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="auth-wrapper">
        <div class="auth-card">
            
            <header class="auth-header">
                <div class="auth-header-icon">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h1 class="auth-title">Password Recovery</h1>
                <p class="auth-subtitle">Cryptographic OTP-based credential reset workflow</p>
            </header>

            <!-- Step Indicator -->
            <div class="steps-indicator" aria-label="Recovery Progress">
                <div class="step-badge step-active" id="step-1-badge">1</div>
                <div class="step-line" id="step-line-1"></div>
                <div class="step-badge" id="step-2-badge">2</div>
                <div class="step-line" id="step-line-2"></div>
                <div class="step-badge" id="step-3-badge">3</div>
            </div>

            <!-- STEP 1: Enter Registered Email -->
            <div id="step-1-panel">
                <form id="form-request-otp" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="forgot-email">Registered Email Address</label>
                        <div class="input-container">
                            <i class="bi bi-envelope input-icon"></i>
                            <input type="email" id="forgot-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
                        </div>
                    </div>

                    <div id="dev-otp-banner" class="alert-banner alert-info d-none">
                        <i class="bi bi-info-circle-fill"></i>
                        <div>
                            <strong>Development OTP:</strong> <span id="dev-otp-code" class="font-monospace">------</span>
                        </div>
                    </div>

                    <button type="submit" id="btn-request-otp" class="btn-primary" style="margin-top: 10px;">
                        <span>Dispatch Security Code</span>
                        <i class="bi bi-send-fill"></i>
                    </button>
                </form>
            </div>

            <!-- STEP 2: Enter 6-Digit OTP -->
            <div id="step-2-panel" class="d-none">
                <div style="text-align: center; margin-bottom: 18px;">
                    <p class="text-secondary small">Enter the 6-digit code dispatched to</p>
                    <strong id="display-email-target" class="text-primary small font-monospace"></strong>
                </div>

                <form id="form-verify-otp" novalidate>
                    <div class="otp-grid">
                        <input type="text" maxlength="1" class="otp-field" inputmode="numeric" autofocus>
                        <input type="text" maxlength="1" class="otp-field" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-field" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-field" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-field" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-field" inputmode="numeric">
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <span id="resend-timer-wrapper" class="text-muted small">
                            Resend code in <strong id="resend-timer-seconds" class="text-primary font-monospace">60s</strong>
                        </span>
                        <button type="button" id="btn-resend-otp" class="form-link d-none">Resend Code</button>
                    </div>

                    <button type="submit" id="btn-verify-otp" class="btn-primary">
                        <span>Verify Code</span>
                        <i class="bi bi-check-lg"></i>
                    </button>
                </form>
            </div>

            <!-- STEP 3: Set New Password -->
            <div id="step-3-panel" class="d-none">
                <form id="form-set-password" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="new-password">New Password</label>
                        <div class="input-container">
                            <i class="bi bi-key input-icon"></i>
                            <input type="password" id="new-password" class="form-input" placeholder="Create new password" required>
                            <button type="button" class="toggle-password-btn" data-target="new-password" aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirm-new-password">Confirm New Password</label>
                        <div class="input-container">
                            <i class="bi bi-shield-check input-icon"></i>
                            <input type="password" id="confirm-new-password" class="form-input" placeholder="Confirm new password" required>
                            <button type="button" class="toggle-password-btn" data-target="confirm-new-password" aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="btn-submit-reset" class="btn-primary" style="margin-top: 10px;">
                        <span>Update Password</span>
                        <i class="bi bi-check-circle-fill"></i>
                    </button>
                </form>
            </div>

            <footer style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-subtle);">
                <a href="login.html" class="form-link">
                    <i class="bi bi-arrow-left"></i> Return to Sign In
                </a>
            </footer>

        </div>
    </main>

    <!-- Modular Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/forgot-password.js"></script>
</body>
</html>
