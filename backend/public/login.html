<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — SecureAuth Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Ambient Background Glow Canvas -->
    <div class="ambient-glow-wrapper" aria-hidden="true">
        <div class="glow-orb glow-orb-1"></div>
        <div class="glow-orb glow-orb-2"></div>
        <div class="glow-orb glow-orb-3"></div>
    </div>
    <div class="grid-mesh" aria-hidden="true"></div>
    <!-- Top Global Navbar -->
    <nav class="navbar" aria-label="Main Navigation">
        <div class="navbar-container">
            <a href="index.html" class="navbar-brand">
                <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
                <span>SecureAuth</span>
            </a>
            <div class="navbar-actions">
                <a href="docs.html" class="btn-outline-sm"><i class="bi bi-book"></i> API Docs</a>
                <a href="register.html" class="btn-primary-sm">Create Account</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="auth-wrapper">
        <div class="auth-card">
            
            <header class="auth-header">
                <div class="auth-header-icon">
                    <i class="bi bi-lock-fill"></i>
                </div>
                <h1 class="auth-title">Account Sign In</h1>
                <p class="auth-subtitle">Enter your registered credentials to establish a session</p>
            </header>

            <!-- Evaluator 1-Click Demo Credentials Banner -->
            <div class="evaluator-banner">
                <div class="evaluator-banner-title">
                    <i class="bi bi-lightning-charge-fill"></i> Evaluation Quick Fill Credentials
                </div>
                <div class="evaluator-buttons-row">
                    <button type="button" class="btn-demo-pill btn-demo-admin" id="btn-demo-admin">
                        <i class="bi bi-shield-lock-fill"></i> Admin Demo
                    </button>
                    <button type="button" class="btn-demo-pill btn-demo-user" id="btn-demo-user">
                        <i class="bi bi-person-fill"></i> User Demo
                    </button>
                </div>
            </div>

            <!-- Lockout Alert Banner -->
            <div id="lockout-banner" class="alert-banner alert-danger d-none">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <div>
                    <strong>Access Restricted:</strong> <span id="lockout-message">Too many failed login attempts.</span>
                </div>
            </div>

            <!-- Login Form -->
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-container">
                        <i class="bi bi-envelope input-icon"></i>
                        <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-label-row">
                        <label class="form-label" for="password">Password</label>
                        <a href="forgot-password.html" class="form-link">Forgot password?</a>
                    </div>
                    <div class="input-container">
                        <i class="bi bi-key input-icon"></i>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-password-btn" data-target="password" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="login-submit-btn" class="btn-primary" style="margin-top: 8px;">
                    <span>Sign In to Account</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <footer style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-subtle);">
                <span class="text-muted small">Don't have an account yet?</span>
                <a href="register.html" class="form-link" style="margin-left: 6px; font-weight: 600;">Sign up</a>
            </footer>

        </div>
    </main>

    <!-- Modular Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/login.js"></script>
</body>
</html>
