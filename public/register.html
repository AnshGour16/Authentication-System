<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — SecureAuth Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Ambient Background Glow Canvas -->
    <div class="ambient-glow-wrapper" aria-hidden="true">
        <div class="glow-orb glow-orb-1"></div>
        <div class="glow-orb glow-orb-2"></div>
        <div class="glow-orb glow-orb-3"></div>
    </div>
    <div class="grid-mesh" aria-hidden="true"></div>
    <!-- Top Global Navbar -->
    <nav class="navbar" aria-label="Main Navigation">
        <div class="navbar-container">
            <a href="index.html" class="navbar-brand">
                <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
                <span>SecureAuth</span>
            </a>
            <div class="navbar-actions">
                <a href="docs.html" class="btn-outline-sm"><i class="bi bi-book"></i> API Docs</a>
                <a href="login.html" class="btn-primary-sm">Sign In</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="auth-wrapper">
        <div class="auth-card" style="max-width: 480px;">
            
            <header class="auth-header">
                <div class="auth-header-icon">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Register credentials with role-segregated access</p>
            </header>

            <!-- Registration Form -->
            <form id="register-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <div class="input-container">
                        <i class="bi bi-person input-icon"></i>
                        <input type="text" id="name" class="form-input" placeholder="Jane Doe" required autocomplete="name">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-container">
                        <i class="bi bi-envelope input-icon"></i>
                        <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">Account Role Tier</label>
                    <div class="input-container">
                        <i class="bi bi-shield-lock input-icon"></i>
                        <select id="role" class="form-select">
                            <option value="user">Standard User (Dashboard & Security Profile)</option>
                            <option value="admin">Administrator (Full RBAC Admin Portal Access)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-container">
                        <i class="bi bi-key input-icon"></i>
                        <input type="password" id="password" class="form-input" placeholder="Enter secure password" required autocomplete="new-password">
                        <button type="button" class="toggle-password-btn" data-target="password" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>

                    <!-- Dynamic Password Strength Meter -->
                    <div class="strength-meter">
                        <div class="strength-bar-track">
                            <div class="strength-bar-fill" id="strength-bar-fill"></div>
                        </div>
                        <div class="strength-meta-row">
                            <span class="text-muted">Password Strength:</span>
                            <span id="strength-text-label" class="strength-label">Awaiting entry</span>
                        </div>
                        <div class="strength-rules-grid">
                            <div class="rule-check" id="rule-length"><i class="bi bi-circle text-muted"></i> 8+ characters</div>
                            <div class="rule-check" id="rule-uppercase"><i class="bi bi-circle text-muted"></i> Uppercase (A-Z)</div>
                            <div class="rule-check" id="rule-lowercase"><i class="bi bi-circle text-muted"></i> Lowercase (a-z)</div>
                            <div class="rule-check" id="rule-number"><i class="bi bi-circle text-muted"></i> Number (0-9)</div>
                            <div class="rule-check" id="rule-symbol"><i class="bi bi-circle text-muted"></i> Symbol (!@#$)</div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm Password</label>
                    <div class="input-container">
                        <i class="bi bi-shield-check input-icon"></i>
                        <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter password" required autocomplete="new-password">
                        <button type="button" class="toggle-password-btn" data-target="confirm-password" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="register-submit-btn" class="btn-primary" style="margin-top: 10px;">
                    <span>Register Account</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <footer style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-subtle);">
                <span class="text-muted small">Already have an account?</span>
                <a href="login.html" class="form-link" style="margin-left: 6px; font-weight: 600;">Sign in</a>
            </footer>

        </div>
    </main>

    <!-- Modular Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/register.js"></script>
</body>
</html>
